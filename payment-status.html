<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pembayaran | KIKA.U</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f0e8;margin:0;padding:24px;color:#111}.box{max-width:640px;margin:9vh auto;background:#fff;padding:36px;border-radius:26px;box-shadow:0 20px 60px #00000010}.mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:26px}h1{font-size:clamp(36px,7vw,54px);line-height:1;margin:20px 0 12px}p{line-height:1.65;color:#666}.amount{font-size:28px;font-weight:800;color:#111}.btn{display:inline-block;background:#111;color:#fff;padding:13px 18px;border-radius:999px;text-decoration:none;font-weight:700;margin-top:12px}.meta{font-size:12px;color:#999;margin-top:18px}</style></head>
<body><main class="box"><div class="mark" id="mark">…</div><h1 id="title">Semak pembayaran…</h1><p id="message">Kami sedang sahkan status transaksi dengan gateway.</p><div class="amount" id="amount"></div><a class="btn" href="/">Kembali ke KIKA.U</a><div class="meta" id="meta"></div></main>
<script>
const q=new URLSearchParams(location.search);const id=q.get('billplz[id]')||q.get('id');
const money=cents=>'RM'+(Number(cents||0)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
(async()=>{const title=document.querySelector('#title'),msg=document.querySelector('#message'),mark=document.querySelector('#mark'),amount=document.querySelector('#amount'),meta=document.querySelector('#meta');if(!id){title.textContent='Terima kasih.';msg.textContent='Tiada rujukan Billplz pada URL. Semak resit gateway atau hubungi KIKA.U jika perlu.';mark.textContent='✓';return}try{const r=await fetch('/api/payment-status?id='+encodeURIComponent(id),{cache:'no-store'});const s=await r.json();if(!r.ok)throw new Error();if(s.paid){title.textContent='Pembayaran berjaya';msg.textContent='Bayaran telah disahkan. KIKA.U boleh teruskan pengesahan order, stok dan penghantaran.';mark.textContent='✓';amount.textContent=money(s.paid_amount||s.amount)}else{title.textContent='Pembayaran belum disahkan';msg.textContent='Transaksi masih belum berstatus paid. Jika anda baru sahaja membayar, refresh halaman ini sebentar lagi.';mark.textContent='…';amount.textContent=money(s.amount)}meta.textContent='Bill ID: '+id+' · Status: '+(s.state||'unknown')}catch{title.textContent='Status belum dapat disemak';msg.textContent='Gateway tidak dapat dihubungi sekarang. Simpan Bill ID ini dan cuba semula atau WhatsApp KIKA.U.';mark.textContent='!';meta.textContent='Bill ID: '+id}})();
</script></body></html>
